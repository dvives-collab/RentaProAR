name: Compilar Escritorio y Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # 1. Compilar para Android (.apk)
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir proyecto
        run: unzip "*.zip" -d ./app
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
      
      - name: Generar APK
        run: |
          DIR=$(dirname $(find ./app -name "pubspec.yaml" | head -n 1))
          cd "$DIR"
          flutter build apk --release

      - name: Subir APK compilado
        uses: actions/upload-artifact@v4
        with:
          name: app-android
          path: app/**/build/app/outputs/flutter-apk/app-release.apk

  # 2. Compilar para Escritorio Windows (.exe)
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir proyecto
        run: Expand-Archive -Path *.zip -DestinationPath ./app
      
      - uses: subosito/flutter-action@v2
      
      - name: Generar ejecutable Windows
        run: |
          $dir = (Get-ChildItem -Path ./app -Filter "pubspec.yaml" -Recurse | Select-Object -First 1).DirectoryName
          cd "$dir"
          flutter build windows --release

      - name: Subir app de Windows
        uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: app/**/build/windows/x64/runner/Release/
