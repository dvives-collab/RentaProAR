name: Compilar RentaPro AR APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 17 (Requerido por Gradle / Capacitor 6)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias y compilar Web App
        run: |
          npm install
          npm run build

      - name: Agregar plataforma Android y sincronizar Capacitor
        run: |
          npx cap add android
          npx cap sync android

      - name: Compilar APK Debug con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar RentaPro-AR.apk como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: RentaPro-AR-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
